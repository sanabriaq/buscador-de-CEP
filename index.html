<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Buscador de CEP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="card__header">
      <span class="selo" aria-hidden="true">CEP</span>
      <h1>Buscador de CEP</h1>
      <p class="subtitulo">Digite um CEP para encontrar o endereço completo.</p>
    </header>

    <form class="busca" id="form-busca" novalidate>
      <label class="sr-only" for="cep">CEP</label>
      <input
        type="text" 
        id="cep"
        inputmode="numeric"
        autocomplete="postal-code"
        maxlength="9"
        placeholder="00000-000"
        required
      >
      <button type="submit" id="btn-buscar">Buscar</button>
    </form>

    <div id="resultado" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
